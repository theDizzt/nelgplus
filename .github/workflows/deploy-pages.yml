name: Deploy NELG++ to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_WINNER_REPORT_API_URL: ${{ vars.VITE_WINNER_REPORT_API_URL }}
        run: npm run build

      - name: Verify Newgrounds archive structure
        run: |
          test -f dist/index.html
          test -d dist/assets

      # Unlike the Pages artifact below, this artifact is a regular ZIP whose
      # root contains index.html, so it can be uploaded directly to Newgrounds.
      - name: Upload Newgrounds HTML5 archive
        uses: actions/upload-artifact@v4
        with:
          name: nelgplus-newgrounds-html5
          path: ./dist/
          if-no-files-found: error
          compression-level: 9

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
